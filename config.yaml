# LeKitten settings. One file, used by both backends.
# Room frame: meters, z up, origin at one floor corner of the play zone.
# "null" = not known yet; filled in during the step named next to it.

backend: sim            # default for --backend (sim | real)
room: sample_room       # which entry under rooms: to use (sample_room | living_room)

shared:
  joints:               # LeRobot SO-101 names; degrees, gripper 0 (open)..100 (closed)
    - shoulder_pan.pos
    - shoulder_lift.pos
    - elbow_flex.pos
    - wrist_flex.pos
    - wrist_roll.pos
    - gripper.pos

  arm:
    max_joint_speed_deg_s: 60
    joint_limits_deg: null   # null = the model's limits; arrival day narrows to the calibrated range

  camera:               # overhead camera, same in sim and real
    width: 640
    height: 480
    fps: 30
    model: Lemi-V1.1 (fisheye)
    fov_deg: 120        # vertical FOV of the sim (pinhole) camera. The real lens is a fisheye
                        # (~125 deg vertical in the 3040x2026 photo); real frames get undistorted (arrival day).

  laser:
    mount_offset_m: [0.0, 0.0, 0.0]   # from the gripper's fixed jaw (S4)
    min_down_angle_deg: 10            # beam always at least this far below horizontal
    shallow_angle_deg: 25             # below this the dot smears (reach map colour)

  safety:
    cat_margin_m: 0.15            # dot never within cat radius + this
    no_cat_timeout_s: 10          # laser off when no cat is seen this long
    max_session_s: 300            # hard stop
    end_hold_s: 1                 # end of session: the dot stops where it is, holds this long, then off

  play:
    session_s: 180
    dot_speed_m_s: 0.6
    lead_distance_m: 0.4

# Everything about a room, in that room's frame. Obstacles are simple invisible
# collision shapes: box {center, size (full x,y,z), yaw_deg} or cylinder {center, radius, height}.
rooms:
  sample_room:          # public stand-in, sim/scenes/sample_room.xml
    scene: sim/scenes/sample_room.xml
    arm_spots:
      A: {xyz: [2.35, 0.75, 0.75], yaw_deg: 180, surface: "table, 75 cm"}
    arm_spot: A
    camera: {xyz: [1.0, -0.6, 2.2], look_at: [1.0, 0.75, 0.0]}
    play_zone: [[0.0, 0.0], [2.0, 0.0], [2.0, 1.5], [0.0, 1.5]]
    hide_spots: [[2.4, 0.75]]          # where the fake cat goes to hide (under the table)
    couch_play: false
    play_surfaces: []
    no_aim_zones:
      - {name: couch, polygon: [[0.0, 2.0], [2.0, 2.0], [2.0, 3.0], [0.0, 3.0]], z_min: 0.0, z_max: 1.4}
    obstacles:
      - {name: table, type: box, center: [2.4, 0.75, 0.375], size: [0.6, 0.8, 0.75]}
      - {name: couch_seat, type: box, center: [1.0, 2.5, 0.225], size: [2.0, 0.9, 0.45]}
      - {name: couch_back, type: box, center: [1.0, 2.9, 0.425], size: [2.0, 0.2, 0.85]}

  living_room:          # the owner's room; scan lives in sim/private_scan/ (never committed)
    scene: sim/scenes/living_room.xml
    # Read off the scan; scale checked 2026-11-08: desk 58.4 cm measured vs 59 cm in scan (0.6 cm).
    # Couch length 2.3 m measured. Other values are still from the scan only.
    # Origin = the rug's corner nearest the desk and side table.
    arm_spots:
      A: {xyz: [-0.30, 0.70, 0.584], yaw_deg: 0, surface: "orange desk, 23 in / 58.4 cm (measured)"}
      B: {xyz: [1.25, -0.25, 0.65], yaw_deg: 90, surface: "round side table (scan says ~65 cm)"}
      C: {xyz: [0.80, -0.35, 0.00], yaw_deg: 90, surface: "floor, below the rug"}
    arm_spot: A
    # On the orange desk, looking across the rug at the couch (photo 2026-11-08 15:35). Tuned in S4.
    camera: {xyz: [-0.30, 1.0, 1.10], look_at: [1.6, 1.0, 0.0]}
    play_zone: [[0.0, 0.0], [1.6, 0.0], [1.6, 2.4], [0.0, 2.4]]     # the rug
    hide_spots: [[1.25, -0.23], [0.19, 2.2]]   # fake cat hides under the side table / behind the wood stand
    # Extra surfaces the dot may land on. The couch seat (31 cm in the scan, 2.3 m long measured)
    # is only used when couch_play is true. Turn it off when people are sitting on the couch.
    couch_play: true
    play_surfaces:
      - {name: couch_seat, polygon: [[1.62, 0.10], [2.85, 0.10], [2.85, 2.40], [1.62, 2.40]], z: 0.31}
    # No-aim zones are 3D boxes the beam must never pass through or land in.
    # With couch_play the couch zone starts above the seat, where a sitting person's head and chest are.
    no_aim_zones:
      - {name: couch_people, polygon: [[1.55, 0.05], [2.95, 0.05], [2.95, 2.75], [1.55, 2.75]],
         z_min: 0.55, z_min_no_couch_play: 0.0, z_max: 1.40}
    obstacles:
      - {name: couch_seat, type: box, center: [2.235, 1.25, 0.155], size: [1.23, 2.3, 0.31]}  # 2.3 m measured
      - {name: couch_back, type: box, center: [2.25, 2.48, 0.375], size: [1.3, 0.45, 0.75]}
      - {name: side_table, type: cylinder, center: [1.25, -0.23, 0.325], radius: 0.28, height: 0.65}
      - {name: desk, type: box, center: [-0.29, 0.69, 0.292], size: [0.45, 1.45, 0.584]}  # 58.4 cm measured
      - {name: wood_stand, type: box, center: [0.19, 1.98, 0.245], size: [0.25, 0.4, 0.49]}

sim:
  arm_model: sim/models/so101/so101.xml
  joint_map:            # per joint: sim_rad = sign * radians(deg) + offset_rad (gripper: 0..100 mapped to its range)
    shoulder_pan.pos:  {sign: 1, offset_rad: 0.0}
    shoulder_lift.pos: {sign: 1, offset_rad: 0.0}
    elbow_flex.pos:    {sign: 1, offset_rad: 0.0}
    wrist_flex.pos:    {sign: 1, offset_rad: 0.0}
    wrist_roll.pos:    {sign: 1, offset_rad: 0.0}
    gripper.pos:       {sign: 1, offset_rad: 0.0}

real:
  arm_port: null        # e.g. /dev/tty.usbmodemXXXX, found on the home Mac
  arm_id: lekitten_follower
  relay_port: null      # LCUS-1 USB relay; auto-detected if null
  camera_index: null    # OpenCV index of the overhead webcam (lerobot-find-cameras opencv)
  camera_rotation_deg: 0   # 90/180/270 if the camera ends up mounted turned
  joint_map:            # checked on arrival day with 3 known poses
    shoulder_pan.pos:  {sign: 1, offset_deg: 0.0}
    shoulder_lift.pos: {sign: 1, offset_deg: 0.0}
    elbow_flex.pos:    {sign: 1, offset_deg: 0.0}
    wrist_flex.pos:    {sign: 1, offset_deg: 0.0}
    wrist_roll.pos:    {sign: 1, offset_deg: 0.0}
    gripper.pos:       {sign: 1, offset_deg: 0.0}
